[project]
name = "namewatch"
version = "0.1.0"
description = "Слушает микрофон и приглушает звук, когда вас зовут по имени"
requires-python = ">=3.10"
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "vosk>=0.3.45",
    "webrtcvad-wheels>=2.0.10",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
oww = ["openwakeword>=0.6"]

[project.scripts]
namewatch = "namewatch.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["namewatch"]
