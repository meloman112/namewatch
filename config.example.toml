# Скопируйте в ~/.config/namewatch/config.toml

[audio]
# Подстрока имени устройства или номер из `namewatch devices`. Пусто = микрофон по умолчанию.
# Важно: микрофон должен слушать комнату, а не быть в наушниках.
device = ""

[detector]
engine = "vosk"            # "vosk" (любое имя без обучения) или "oww" (openWakeWord, своя модель)
# Все варианты, на которые реагируем: имя, уменьшительные, падежи. Строчными буквами.
names = ["вася", "василий", "васёк"]
min_conf = 0.7             # порог уверенности итогового распознавания (0..1)

[detector.vosk]
model_path = "~/.local/share/namewatch/vosk-model-small-ru-0.22"

[detector.oww]
model_path = ""            # путь к .onnx модели вашего слова
threshold = 0.5

[vad]
aggressiveness = 2         # 0..3, больше = строже к шуму
hangover_ms = 300          # сколько тишины считать концом фразы

[duck]
backend = "pactl"          # pactl работает и с PulseAudio, и с PipeWire (Ubuntu по умолчанию)
level = 15                 # до скольки % от исходной громкости приглушать
down_ms = 150              # скорость затухания
up_ms = 1200               # скорость возврата
hold_s = 4.0               # сколько держать приглушение после последней речи
max_hold_s = 30.0          # жёсткий предел, чтобы не застрять приглушённым
